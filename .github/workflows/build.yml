name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm python3
          clang --version | head -2
          (ld64.lld --version || true) | head -2

      - name: Fetch iPhoneOS SDK
        run: |
          chmod +x scripts/*.sh
          ./scripts/fetch-sdk.sh

      - name: Build dylib
        run: ./scripts/build-linux.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aether-dylib
          path: build/Aether.dylib
          if-no-files-found: error

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" build/Aether.dylib \
            --title "Aether $TAG" \
            --notes "Automated build (arm64 + arm64e). Inject into any IPA and re-sign." \
            --latest
